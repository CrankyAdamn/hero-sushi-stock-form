<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stocktake Form | Hero Sushi Tuggerah</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f0f8ff; padding: 10px; }
        
        /* Header styling */
        .header-container { text-align: right; margin-bottom: 20px; }
        .main-title { color: #1d1d1f; font-size: 24px; font-weight: bold; margin: 0; }
        .sub-title { color: #e6e6e6; font-size: 12px; margin: 0; background-color: #333; display: inline-block; padding: 2px 5px; }

        table { width: 100%; border-collapse: collapse; background: white; }
        th { background-color: #add8e6; padding: 10px; border: 1px solid #ccc; text-align: center; }
        td { padding: 5px; border: 1px solid #ddd; text-align: center; }
        .section-header { background-color: #d3d3d3; font-weight: bold; text-align: left; padding: 10px; }
        .order-col { background-color: #ffc0cb; font-weight: bold; }
        input { width: 50px; text-align: center; }
        button { margin-top: 20px; padding: 15px; width: 100%; background-color: #4CAF50; color: white; border: none; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header-container">
    <h1 class="main-title">Stocktake Form | Hero Sushi Tuggerah</h1>
    <p class="sub-title">By Adam</p>
</div>

<form id="stockForm">
    <table>
        <thead>
            <tr>
                <th>Items</th>
                <th>Prep</th>
                <th>Fridge</th>
                <th>Freezer</th>
                <th>Expected</th>
                <th class="order-col">Order</th>
            </tr>
        </thead>
        <tbody>
            <tr class="section-header"><td colspan="6">NIGIRI SECTION</td></tr>
            <tr>
                <td>Salmon Nigiri</td>
                <td><input type="number" class="calc" data-expected="30"></td>
                <td><input type="number" class="calc"></td>
                <td><input type="number" class="calc"></td>
                <td>30</td>
                <td class="order-col"><span class="result">0</span></td>
            </tr>
            <!-- Add more rows here -->
        </tbody>
    </table>
    <button type="button" onclick="calculateOrder()">Calculate Order</button>
</form>

<script>
    function calculateOrder() {
        const rows = document.querySelectorAll('tbody tr:not(.section-header)');
        rows.forEach(row => {
            const inputs = row.querySelectorAll('.calc');
            const expected = parseInt(row.querySelector('td:nth-child(5)').innerText) || 0;
            const stock = Array.from(inputs).reduce((sum, input) => sum + (parseInt(input.value) || 0), 0);
            const order = Math.max(0, expected - stock);
            row.querySelector('.result').innerText = order;
        });
    }
</script>

</body>
</html>
